<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Ajuda Profissional</title>
    <link rel="stylesheet" href="/frontend/duvidas.css">
</head>

<body>

    <h1>Escreva aqui a sua dúvida</h1>

    <form action="#" method="post">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="duvida">Digite sua dúvida:</label>
        <br>
        <textarea id="duvida" name="duvida" rows="8" cols="50" required></textarea>

        <br><br>

        <button type="submit">Enviar dúvida</button>

    </form>

</body>

</html>
